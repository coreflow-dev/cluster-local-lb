name: Test and Publish Helm Chart

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    name: Test & Publish Chart
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/cluster-local-lb:dev

    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Kubebuilder
        run: |
          KUBEBUILDER_VERSION="4.15.0"
          curl -L -o kubebuilder https://github.com/kubernetes-sigs/kubebuilder/releases/download/v${KUBEBUILDER_VERSION}/kubebuilder_linux_amd64
          chmod +x kubebuilder
          sudo mv kubebuilder /usr/local/bin/

      - name: Generate Helm Chart
        run: |
          IMG="${{ env.IMAGE_REF }}" kubebuilder edit --plugins=helm/v2-alpha

      - name: Lint Helm Chart
        run: |
          helm lint ./dist/chart

      - name: Install KinD
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify KinD
        run: kind version

      - name: Create KinD cluster
        run: kind create cluster

      - name: Build & Load Docker Image
        run: |
          go mod tidy
          make docker-build IMG="${{ env.IMAGE_REF }}"
          kind load docker-image "${{ env.IMAGE_REF }}"

      - name: Deploy manager via Helm
        run: |
          make helm-deploy IMG="${{ env.IMAGE_REF }}"

      - name: Check Helm release status
        run: |
          make helm-status

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push Helm Chart
        if: github.event_name == 'push'
        run: |
          helm package dist/chart --version "0.0.0-dev.${GITHUB_SHA:0:7}" --destination .
          helm push cluster-local-lb-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

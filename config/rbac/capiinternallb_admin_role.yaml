# This rule is not used by the project kubernetes-capi-local-loadbalancer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over internallb.io.schaber.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-capi-local-loadbalancer
    app.kubernetes.io/managed-by: kustomize
  name: capiinternallb-admin-role
rules:
  - apiGroups:
      - internallb.io.schaber
    resources:
      - capiinternallbs
    verbs:
      - '*'
  - apiGroups:
      - internallb.io.schaber
    resources:
      - capiinternallbs/status
    verbs:
      - get

# This rule is not used by the project kubernetes-capi-local-loadbalancer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the internallb.io.schaber.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-capi-local-loadbalancer
    app.kubernetes.io/managed-by: kustomize
  name: capiinternallb-editor-role
rules:
  - apiGroups:
      - internallb.io.schaber
    resources:
      - capiinternallbs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - internallb.io.schaber
    resources:
      - capiinternallbs/status
    verbs:
      - get
